name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the problem rather than the solution. It often turns out
        there is a simpler fix than the one that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        Lock In is deliberately just a timer. Please confirm before filing.
      options:
        - label: This does not require an account, a server, or sending data anywhere.
          required: true
        - label: This is not a task list, calendar or habit tracker.
          required: true
