name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Pick the Classic preset
        2. Start focus, then close the popover
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux (built from source)
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings, or the release you downloaded.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.2, Windows 11 23H2
