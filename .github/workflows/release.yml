name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lock In ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            See [CHANGELOG](https://github.com/PonyGShock/Lock-In-Timer/commits/${{ github.ref_name }}).

            **macOS:** these builds are unsigned, so macOS will claim the app
            is damaged. It is not — it is just unsigned. Run
            `xattr -cr "/Applications/Lock In.app"` once after installing.

            **Windows:** SmartScreen will warn about an unrecognised app.
            Choose "More info", then "Run anyway".

            Signing costs money and this app does not. If you would rather not
            take that on faith, the source builds in about five minutes.
          # Unsigned on purpose. Adding signing later means setting the
          # APPLE_* secrets; see docs/DISTRIBUTION.md.
          args: --target ${{ matrix.target }}
